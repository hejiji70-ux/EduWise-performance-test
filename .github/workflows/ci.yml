name: Performance Test CI

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'jmeter/**'
      - '_gen_jmx.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'jmeter/**'
      - '_gen_jmx.py'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XML lint tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils

    - name: Validate JMX XML format
      run: |
        xmllint --noout jmeter/*.jmx || echo "JMX validation warnings (non-critical)"

    - name: Upload JMX file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-scripts
        path: jmeter/
